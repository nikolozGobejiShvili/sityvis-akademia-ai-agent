<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Admin — სიტყვის აკადემია{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0; background: #f7f7f5; color: #222; }
    header { background: #1f2933; color: #fff; padding: 12px 24px;
             display: flex; align-items: center; gap: 24px; }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header nav a { color: #b6c0cc; text-decoration: none; margin-right: 16px;
                   font-size: 14px; }
    header nav a:hover { color: #fff; }
    main { padding: 24px; max-width: 980px; margin: 0 auto; }
    h2 { font-size: 20px; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border-radius: 6px; overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    th, td { text-align: left; padding: 10px 12px;
             border-bottom: 1px solid #eaeaea; font-size: 14px; }
    th { background: #fafafa; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    a.button, button.button {
        display: inline-block; padding: 8px 14px; background: #2e7d32;
        color: #fff; text-decoration: none; border-radius: 4px;
        border: none; font-size: 14px; cursor: pointer;
    }
    a.button.secondary, button.button.secondary {
        background: #455a64;
    }
    a.button.danger, button.button.danger { background: #c62828; }
    form.inline { display: inline; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #fff; padding: 16px; border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
    input[type=text], input[type=number], input[type=url], textarea, select {
        width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;
        font-size: 14px; box-sizing: border-box; font-family: inherit;
    }
    textarea { min-height: 120px; }
    .error { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a;
             padding: 12px; border-radius: 4px; margin-bottom: 12px;
             font-size: 13px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
             font-size: 12px; font-weight: 500; }
    .badge.active { background: #e8f5e9; color: #1b5e20; }
    .badge.hidden { background: #ececec; color: #555; }
    .badge.full { background: #fff3e0; color: #e65100; }
    .badge.coming_soon { background: #e3f2fd; color: #0d47a1; }
    .status-line { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Admin — {{ request.app.title }}</h1>
    <nav>
      <a href="/admin">Dashboard</a>
      <a href="/admin/programs">Programs</a>
      <a href="/admin/templates">Templates</a>
      <a href="/admin/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
