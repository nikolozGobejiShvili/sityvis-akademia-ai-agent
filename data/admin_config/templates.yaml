  followup_24h: "გამარჯობა.\r\nგუშინ ბანაკის შესახებ მოგწერეთ და უბრალოდ მინდა გკითხოთ\
    \ - ხომ არ დაგრჩათ რაიმე კითხვა?\r\nხშირად მშობლებს გადაწყვეტილების მიღებამდე\
    \ ყველაზე მეტად აინტერესებთ:\r\n• შეეფერება თუ არა ბანაკი ბავშვის ასაკს\r\n• როგორ\
    \ ეგუებიან ბავშვები ეკრანის გარეშე ყოფნას\r\n• რა იცვლება ამ 7 დღეში\r\n• და როგორი\
    \ გარემოა ადგილზე\r\nთუ გინდათ, შეგიძლიათ ერთი სიტყვით მომწეროთ, რა არის თქვენთვის\
    \ ყველაზე მნიშვნელოვანი, და ზუსტად იმ ნაწილზე ვისაუბროთ\r\n"
  followup_3d: "ერთ რამეს გაგიზიარებთ, რაც მშობლებისგან ხშირად გვესმის.\r\nბევრს თავიდან\
    \ ჰგონია, რომ ბანაკი უბრალოდ დასვენებაა.\r\nმაგრამ რეალურად ყველაზე დიდი ცვლილება\
    \ იწყება მაშინ, როცა ბავშვი რამდენიმე დღით ხვდება გარემოში, სადაც:\r\n• უსმენენ\r\
    \n• აზრს ეკითხებიან\r\n• ეკრანის გარეშე ერთვება რეალურ ურთიერთობაში\r\n• და თავს\
    \ უსაფრთხოდ გრძნობს\r\nასეთ გარემოში ბავშვები ხშირად ბუნებრივად იხსნებიან.\r\n\
    \r\nhttps://youtu.be/1DvexrTmGUw?si=bWaZ3s7OyU4X64cI"
  followup_7d: "ბოლო შეტყობინებას გწერთ ამ თემაზე, რომ ზედმეტად არ შეგაწუხოთ.\r\n\
    ბანაკის ნაკადებზე ადგილები ეტაპობრივად ივსება, ამიტომ თუ ჯერ კიდევ ფიქრობთ მონაწილეობაზე,\
    \ სიამოვნებით დაგეხმარებით გადაწყვეტილებაში.\r\nშეგიძლიათ მომწეროთ:\r\n• ასაკი\r\
    \n• მთავარი კითხვა\r\n• ან უბრალოდ ნომერი, დაგირეკავთ და გაგესაუბრებით\r\nმოკლედ\
    \ გეტყვით, რამდენად შეეფერება ეს ბანაკი თქვენს შვილს.\r\nთუ ახლა არ არის თქვენთვის\
    \ აქტუალური, პრობლემა არ არის.\r\n"
