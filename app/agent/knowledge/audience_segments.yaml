# Audience segments — extracted from docs/source/სამიზნე აუდიტორია.pdf.
#
# This file is the runtime knowledge source for sales-aware tone shifts.
# It is intentionally compact: only the facts the LLM engine needs to
# adapt wording at the closed-set scale. Do NOT add long verbatim passages
# from the source — those live in docs/source/ for human review.
#
# Schema:
#   segments[<key>]:
#     label              str   — human-readable Georgian name
#     age_range          str   — adult/parent age band (optional)
#     child_age_range    str   — relevant child age band (optional)
#     decision_maker     bool  — whether this segment makes the buy decision
#     core_need          str   — single-sentence Georgian summary
#     pain_points        list[str]
#     desires            list[str]
#     objections         dict[name -> {concern, response_angle}] (optional)
#     message_angles     list[str]
#   micro_segments[<key>]:
#     key_triggers       list[str]  — Georgian keywords that suggest this micro-segment
#     message_angle      str        — single-sentence tone-adapter

segments:
  parent_development_concern:
    label: "მშობელი, რომელიც შვილის განვითარებაზე ღელავს"
    age_range: "35–48"
    child_age_range: "7–17"
    decision_maker: true
    core_need: "აზრიანი გარემო, ცოცხალი ურთიერთობა, პიროვნული განვითარება"
    pain_points:
      - "ბავშვი დიდ დროს ატარებს ტელეფონთან"
      - "ნაკლები ცოცხალი კომუნიკაცია აქვს"
      - "უჭირს საკუთარი აზრის ჩამოყალიბება"
      - "არ აქვს მოტივაცია"
      - "მშობელი ეძებს სწორ გარემოს"
    desires:
      - "უსაფრთხო და ხარისხიანი გარემო"
      - "საინტერესო ადამიანები"
      - "ფიქრი, საუბარი, მოსმენა"
      - "თავდაჯერებულობა"
      - "სწორი წრე"
      - "ეკრანს მოსცილდეს ბუნებრივად"
    objections:
      price:
        concern: "ღირს ამდენი?"
        response_angle: "ეს არის გარემო, რომელიც ავითარებს ფიქრს, კომუნიკაციას, თავდაჯერებას და ურთიერთობას."
      result_unclear:
        concern: "რა შეიცვლება ჩემს შვილში?"
        response_angle: "ღირებულება ჩანს იმაში, როგორ იწყებს ბავშვი საუბარს, კითხვას, დაკვირვებას და ურთიერთობას."
      safety:
        concern: "რამდენად დაცულია სივრცე?"
        response_angle: "გარემო წინასწარ არის შერჩეული და ორგანიზებული უსაფრთხო, მაგრამ თავისუფალი გამოცდილებისთვის."
      child_interest:
        concern: "ჩემს შვილს მოუნდება?"
        response_angle: "ფორმატი არ ჰგავს ფორმალურ გაკვეთილს — ბავშვი ერთვება გამოცდილებით, დისკუსიით და ცოცხალი ურთიერთობით."
    message_angles:
      - "ეს არ არის უბრალოდ დასვენება — ეს არის აზრიანი გარემო."
      - "ეკრანების ეპოქაში ბავშვს ყველაზე მეტად ცოცხალი ურთიერთობა სჭირდება."
      - "ბავშვის განვითარება მხოლოდ ნიშნებით არ იზომება."

  teen_self_expression:
    label: "მოზარდი, რომელსაც სჭირდება გარემო და თვითგამოხატვა"
    age_range: "12–17"
    pain_points:
      - "სჭირდება სივრცე აზრის გამოსახატად"
      - "ეშინია შეცდომის"
      - "სჭირდება ახალი მეგობრები"
      - "უნდა იგრძნოს, რომ სერიოზულად იღებენ"
    desires:
      - "ახალი მეგობრები"
      - "საინტერესო გამოცდილება"
      - "თავისუფალი საუბარი"
      - "საკუთარი აზრის გამოხატვა"
      - "მიკუთვნებულობის განცდა"
    message_angles:
      - "ეს არ არის გაკვეთილი."
      - "ადგილი, სადაც შენი აზრი მართლა ისმის."
      - "7 დღე, რომელიც ჩვეულებრივ ზაფხულს არ დაემსგავსება."

  adult_cultural_evenings:
    label: "ზრდასრული, რომელიც ეძებს კულტურულ და ინტელექტუალურ განტვირთვას"
    age_range: "27–55"
    core_need: "შინაარსიანი საღამო, კულტურული გამოცდილება, საინტერესო ადამიანები"
    pain_points:
      - "რუტინა"
      - "ზედაპირული სოციალური ცხოვრება"
      - "ცოცხალი საუბრის ნაკლებობა"
      - "ინტელექტუალური გარემოს დეფიციტი"
    desires:
      - "შინაარსიანი საღამო"
      - "კულტურული გამოცდილება"
      - "საინტერესო ადამიანები"
      - "მშვიდი და გემოვნებიანი გარემო"
      - "შინაგანი შევსება"
    message_angles:
      - "საღამო მათთვის, ვისაც დასვენება მხოლოდ გართობა არ ჰგონია."
      - "კულტურა, საუბარი და მუსიკა — სივრცე, რომელიც შინაგანად გავსებს."
      - "ერთი საღამო, რომელიც რუტინიდან გამოგიყვანს."

  emigrant_parent:
    label: "ემიგრანტი ქართველი მშობელი"
    child_age_range: "6–17"
    core_need: "ქართულ ენასთან, კულტურასთან და იდენტობასთან კავშირის შენარჩუნება"
    pain_points:
      - "ბავშვი ქართულად ნაკლებად საუბრობს"
      - "ქართული კულტურა ყოველდღიური რეალობა აღარ არის"
      - "ქართული ენა შეიძლება ვალდებულებად იქცეს"
      - "მშობელი ეძებს ხარისხიან ქართულ გარემოს"
    desires:
      - "შვილმა ქართული ენა ბუნებრივად შეინარჩუნოს"
      - "არ დაკარგოს კულტურული კავშირი"
      - "ჰყავდეს ქართველი თანატოლები"
      - "ქართული იდენტობა ცოცხალ გამოცდილებად დარჩეს"
    message_angles:
      - "ქართული გარემო ბავშვებისთვის, რომლებიც საქართველოდან შორს იზრდებიან."
      - "საქართველო ბავშვისთვის მხოლოდ მოგონება რომ არ იყოს."
      - "ქართული ენა, კულტურა და ურთიერთობა — მსოფლიოს ნებისმიერი წერტილიდან."

micro_segments:
  premium_parent:
    key_triggers:
      - "უსაფრთხოება"
      - "ხარისხი"
      - "სწორი წრე"
      - "პრემიუმ გარემო"
    message_angle: "პრემიუმ გარემო ბავშვებისთვის, სადაც განათლება, ურთიერთობა და ღირებულებები ერთიანდება."

  values_oriented_parent:
    key_triggers:
      - "ღირებულებები"
      - "აზროვნება"
      - "კულტურა"
      - "შინაგანი ზრდა"
    message_angle: "სივრცე, სადაც ბავშვი არა მხოლოდ ისვენებს, არამედ ყალიბდება, როგორც პიროვნება."

  busy_parent:
    key_triggers:
      - "მოკლე და მკაფიო ინფორმაცია"
      - "უსაფრთხოება"
      - "მარტივი გადაწყვეტილება"
      - "ლოგისტიკა"
    message_angle: "თქვენი შვილისთვის უსაფრთხო, აზრიანი და ხარისხიანი გარემო — წინასწარ გააზრებული პროგრამით."
