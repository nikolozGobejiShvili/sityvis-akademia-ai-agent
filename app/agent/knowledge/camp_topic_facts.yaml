# Ordered topic-specific unknown categories (first match wins). Each: the exact
# `topic` phrase, the operational `noun_markers`, and optional `cue_markers`
# (omit / null → the noun alone is enough). The noun+cue pairing keeps a parent
# DESCRIBING the child („ერთ ოთახში გამოიკეტება") from being read as a rooms
# question.
camp_unknown_categories:
  - key: room
    # EXACT room count / distribution. Typo-tolerant nouns (ოთახ / ოთხაშ / ოთაშ)
    # so „ოთხაში რამდენი ბავაში იქნება?" still defers. The cue set includes the
    # „how many will there be" forms. General accommodation („განთავსება როგორია?")
    # has no room noun → it is answered by the `accommodation` topic instead.
    topic: "ოთახებში ბავშვების განაწილებას"
    noun_markers: [ოთახ, ოთხაშ, ოთაშ, საწოლ, თანაფარდობ]
    cue_markers: [რამდენი, რამდენ, რამდენნი, ანაწილებ, განაწილებ, როგორ, ვინ, რა პრინციპ, რა წესით, იქნებ, იქნებიან]
  - key: towels
    topic: "პირსახოცებს"
    noun_markers: [პირსახოც, ხელსახოც]
  - key: hotel
    # „სასტუმრო" OR „სტუმრ" (guest) — so „სხვა სტუმრები იქნებიან ბანაკში?" defers
    # even when the word „სასტუმრო" itself is absent (client-review 2026-06-30).
    # The cue REQUIRES an „other / only / who" marker so „მოწვეული სტუმრები
    # არიან?" (invited guests — an event question) is NOT swallowed as a hotel
    # accommodation question and reaches the engine (regression fix 2026-07-02).
    topic: "სასტუმროში სხვა სტუმრების ყოფნას"
    noun_markers: [სასტუმრო, სტუმრ]
    cue_markers: [სხვა, მარტო, მხოლოდ, ვინ]
  - key: stadium
    topic: "სტადიონს"
    noun_markers: [სტადიონ, სპორტული მოედან]
  - key: pool
    topic: "საცურაო აუზს"
    noun_markers: [საცურაო აუზ, საბანაო აუზ, აუზ]
  - key: transport
    topic: "ტრანსპორტის გასვლის ზუსტ ადგილს"
    noun_markers: [ტრანსპორტ, ავტობუს, მიკროავტობუს, წამოსვლ]
    cue_markers: [საიდან, სად, გავა, გადის, ავდივ, შეხვედრ, ადგილ, წამო]
  - key: schedule
    # Day-schedule ONLY — deliberately NOT bare „გრაფიკ" (that also matches
    # „წამლის გრაფიკი" = medical, and „გადახდის გრაფიკი" = payment).
    topic: "დღის ზუსტ განრიგს"
    noun_markers: [დღის განრიგ, საათობრივ, დღის რეჟიმ, დღის გეგმ, დღის რუტინ, დღის განაწეს]
  - key: direct_call
    # Call / phone-contact rules. Typo-tolerant + verbal-noun coverage: the
    # verbal noun „დარეკვა/დარეკვას/დარეკვის" („to call") is added so
    # „დღეში რამდენჯერ შევძლებ დარეკვას?" defers deterministically (client QA
    # 2026-07-01), alongside the finite forms „დავურეკ/დაურეკ/ვურეკ" and the
    # bell/ring noun „ზარ". Cues add „შეეძლ" (can) + „დრო" (time) so
    # „ბავშვს დარეკვა შეეძლება?" / „ზარის დრო როგორ იქნება?" match too.
    topic: "ბავშვთან პირდაპირი კონტაქტის წესებს"
    noun_markers: [დავურეკ, დაურეკ, ვურეკ, დარეკვ, რეკვ, ზარ]
    cue_markers: [რამდენჯერ, დღეში, ხშირად, როდის, შემიძლი, შეეძლ, წეს, დრო]

