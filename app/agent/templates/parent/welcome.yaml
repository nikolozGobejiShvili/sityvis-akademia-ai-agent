welcome: |-
  გამარჯობა.

  გვითხარით, რა გაინტერესებთ:
  — ბავშვების საზაფხულო ბანაკი
  — ზრდასრულთა კულტურული საღამოები
welcome_camp_opener: |-
  სიტყვის აკადემიის ბანაკი არ არის უბრალოდ დასვენება — ეს არის 7 დღიანი გარემო, სადაც ბავშვი ცილდება ციფრულ ხმაურს და სწავლობს ცოცხალ აზროვნებას.

  სანამ დეტალებზე გადავალთ — რამდენი წლისაა შვილი?
welcome_with_concern: |-
  გამარჯობა.

  ის, რასაც ახსენებთ, ბევრს აწუხებს ახლა. სიტყვის აკადემიის ბანაკი სწორედ ამ ფენაში მუშაობს — 7 დღიანი გარემო, სადაც ბავშვი ცილდება ციფრულ ხმაურს და სწავლობს ცოცხალ ურთიერთობას.

  სანამ უფრო კონკრეტულად გეტყვით — რამდენი წლისაა შვილი?
