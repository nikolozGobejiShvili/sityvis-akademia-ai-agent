ask_challenge: |-
  მესმის.

  რას ელით ბანაკისგან თქვენი შვილისთვის — ცოცხალი გარემო, ახალი მეგობრები, ზაფხულის გამოცდილება, თუ რაიმე უფრო კონკრეტული?
ask_deeper: |-
  გასაგებია.

  რომ უკეთ წარმოვიდგინო — როცა შვილი მარტოა ან კომპანიის გარეთ, რას უყვარს, რას აკეთებს ხშირად?
ask_desire: |-
  ნათელია.

  თუ წარმოვიდგინოთ, რომ ექვს თვეში ეს გვერდით გადგას — რა შეიცვალა შვილში? რას ნახავთ მისგან, რასაც ახლა ვერ?
present_value_fallback: |-
  სიტყვის აკადემიის ბანაკი არ არის უბრალოდ დასვენება — ეს არის 7-დღიანი გარემო, სადაც მცირე ჯგუფებში ბავშვს ვეხმარებით:
  — გაიჩინოს ახალი მეგობრები
  — განივითაროს დამოუკიდებელი აზროვნება
  — დაინახოს, რამდენად საინტერესოა რეალური სამყარო

  გსურთ უფასო კონსულტაცია, სადაც სპეციალისტი თქვენი შვილის სიტუაციას უფრო დეტალურად მოგისმენთ?
