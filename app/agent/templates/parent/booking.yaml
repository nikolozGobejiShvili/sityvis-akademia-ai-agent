offer_consultation: |-
  აქ უახლოესი დროები — აირჩიეთ, რომელი მოგწონთ:

  {calendar_slots}
booking_confirmed: |-
  დაჯავშნილია.

  📅 {date}, {time}

  მენეჯერი მალე დაგიკავშირდებათ — შვილზე უფრო დეტალურად ისაუბრებთ.
done_response: თქვენი კონსულტაცია უკვე დაჯავშნილია. მენეჯერი მალე დაგიკავშირდებათ.
slot_unavailable: |-
  სამწუხაროდ, {date} {time} დაკავებულია.

  აქ უახლოესი თავისუფალი დროები:

  {calendar_slots}
clarify_slot_choice: |-
  ვერ გავიგე, რომელი დრო გირჩევნიათ.

  გთხოვთ აირჩიოთ:
  — ნომერი 1, 2 ან 3 ზემოთ მოცემული სიიდან
  — ან მითითეთ კონკრეტული თარიღი და დრო (მაგ. „22 მაისს 15:00“)
booking_failed: |-
  სამწუხაროდ ტექნიკური პრობლემა შეგვექმნა.

  ჩვენი მენეჯერი მალე დაგიკავშირდებათ უშუალოდ — ბოდიში მოუხერხებლობისთვის.
