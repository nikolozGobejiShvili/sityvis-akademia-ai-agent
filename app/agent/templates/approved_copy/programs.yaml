programs:
  camp:
    public_policy:
      current_final_stream_started: |-
        ბანაკის ბოლო ნაკადი უკვე დაიწყო და რეგისტრაცია დასრულებულია.
      future_information_not_announced: |-
        შემდეგი ბანაკის თარიღები და რეგისტრაციის ინფორმაცია ჯერ არ არის გამოცხადებული.
    price:
      full_block: |-
        ბანაკის ფასი არის {price} ლარი.

        ამ თანხაში შედის ტრანსპორტირება, განთავსება, კვება და სრული პროგრამა.

        გადახდის გადანაწილება შესაძლებელია {installments_months} თვემდე {banks_phrase} საშუალებით.

        10%-იანი ფასდაკლება მოქმედებს დედმამიშვილებისთვის და წინა ბანაკის მონაწილეებისთვის.

        თუ გსურთ, კონსულტაციაზე ჩაგწერთ, სადაც დეტალებს მენეჯერი გაგაცნობთ.
      payment_process: |-
        ბანაკის ჯავშნის საფასურის გადახდა ხდება წინასწარ, ხოლო სრული თანხის — ხელშეკრულებით გათვალისწინებულ დროში. გადახდის გადანაწილება შესაძლებელია 6 თვემდე TBC-ისა და საქართველოს ბანკის საშუალებით
      reservation_exact_amount_deferral: |-
        რაც შეეხება ჯავშნის საფასურს, ამ დეტალებს მენეჯერი გაგაცნობთ: {manager_phone}
      exact_amount_manager_deferral_line: |-
        ჯავშნის ზუსტ თანხას, ბანკის გრაფიკსა და ყოველთვიურ გადასახადს მენეჯერი გაგაცნობთ : {manager_phone}
    manager:
      direct_phone: |-
        მენეჯერის ნომერია: {manager_phone}. შეგიძლიათ პირდაპირ დაუკავშირდეთ.
      direct_phone_with_callback: |-
        მენეჯერის ნომერია: {manager_phone}. შეგიძლიათ პირდაპირ დაუკავშირდეთ. თუ გირჩევნიათ, დატოვეთ თქვენი ნომერი და მენეჯერი თავად დაგიკავშირდებათ.
      direct_phone_callback_known: |-
        მენეჯერის ნომერია: {manager_phone}. შეგიძლიათ პირდაპირ დაუკავშირდეთ. მენეჯერი ასევე თავად დაგიკავშირდებათ.
      unknown_detail_ending: |-
        ამ დეტალებს მენეჯერი გაგაცნობთ : {manager_phone}
      parent_contact_visit_defer: |-
        რაც შეეხება ბავშვთან პირდაპირი დარეკვის ან ჩამოსვლის წესებს, ამ დეტალებს მენეჯერი გაგაცნობთ: {manager_phone}
    medical:
      medication_clarification: |-
        ბანაკში არის სამედიცინო პერსონალი 24/7.

        კონკრეტული მედიკამენტის მიღების გრაფიკი და კონტროლის წესი წინასწარ მენეჯერთან უნდა დაზუსტდეს, რომ ინფორმაცია სწორად გადაეცეს პასუხისმგებელ გუნდს.

        თუ გსურთ, მენეჯერთან დაგაკავშირებთ.
    logistics:
      transport:
        included: |-
          ბანაკის ღირებულებაში ტრანსპორტირება შედის.
        details_defer: |-
          ტრანსპორტირების ზუსტ დეტალებს მენეჯერი გაგაცნობთ: {manager_phone}
        pickup_defer: |-
          რაც შეეხება ტრანსპორტის გასვლის ზუსტ ადგილს და დროს, ამ დეტალებს მენეჯერი გაგაცნობთ: {manager_phone}
        city_details_defer: |-
          რაც შეეხება {city_ablative} ტრანსპორტირების ზუსტ დეტალებს, ამ ინფორმაციას მენეჯერი გაგაცნობთ: {manager_phone}
    registration:
      # PENDING CLIENT DECISION: URL-first active parent_flow variant.
      url_first: |-
        ბანაკზე რეგისტრაცია ხდება ამ ბმულზე:
        {registration_url}

        ფორმის შევსების შემდეგ მენეჯერი დაგიკავშირდებათ დეტალების დასაზუსტებლად.
      # PENDING CLIENT DECISION: consultation-first active router variant.
      consultation_first: |-
        რეგისტრაციამდე მოკლე კონსულტაცია სჯობს, რომ ბავშვის ასაკი და საჭიროება სწორად გადავამოწმოთ. მითხარით სასურველი დღე და საათი, ან მომწერეთ თქვენი ნომერი — მენეჯერი დაგიკავშირდებათ.

        რეგისტრაციის ბმული: {registration_url}
      # Legacy-live START/BOOK branch. Keep separate until business chooses a
      # winner among registration variants.
      fast_track: |-
        გამარჯობა.

        სიამოვნებით დაგეხმარებით. რეგისტრაცია ხდება ბმულზე:
        {registration_url}

        თუ ჯერ კონსულტაცია გსურთ სპეციალისტთან — გვითხარით შვილის ასაკი, რომ უფრო კონკრეტული ვიყოთ.
