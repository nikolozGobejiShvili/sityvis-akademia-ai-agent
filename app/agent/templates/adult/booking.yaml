send_booking: |
  სიამოვნებით. ადგილის დასაჯავშნად:

  {booking_link}

  ჯავშნის შემდეგ მიიღებთ დადასტურებას.
  ნებისმიერი კითხვის შემთხვევაში აქ ვართ.
booking_forwarded: |
  თქვენი ინტერესი დაფიქსირდა და ჩვენს გუნდს გადაეცა.
  დადასტურების შემდეგ საღამოს დეტალებს მიიღებთ არჩეულ საკომუნიკაციო არხზე.
